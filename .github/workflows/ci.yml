# Runs on every pull request and on pushes to main: the same checks we run before merging.
# No secrets are needed: the build doesn't touch the database, and the unit tests are pure.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installs exactly what pnpm-lock.yaml says. pnpm-workspace.yaml makes the install itself
      # refuse brand-new releases, trust downgrades, unreviewed install scripts and packages
      # from outside the npm registry (docs/supply-chain.md).
      - name: Install
        run: pnpm install --frozen-lockfile

      # Every locked package's hash matches the npm registry and is signed; no direct
      # dependency looks like a slopsquat (scripts/verify-deps.mjs)
      - name: Verify dependencies
        run: node scripts/verify-deps.mjs

      # Fails on known critical vulnerabilities in what the site runs
      - name: Security audit
        run: pnpm audit --prod --audit-level critical

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # SCRUM-191: the demo path in a real browser, against a production build, a throwaway MySQL
  # database (same engine as Aiven) and a fake Stripe. See playwright.config.ts and e2e/.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: bookworms_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci-only-root@127.0.0.1:3306/bookworms_e2e
      DB_SSL: 'false'
      E2E_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Throwaway secrets for this run
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=E2e-$(openssl rand -hex 8)!Aa" >> "$GITHUB_ENV"

      - name: Database (migrate, seed, test accounts)
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm e2e:setup

      - name: Build
        run: pnpm build

      - name: Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
